[project]
name = "afr-workspace"
version = "0.0.0"
description = "Agent Flight Recorder — local development workspace"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sdk", "server", "examples/langgraph_sre_agent", "examples/openai_agents_sre_agent"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = [
    "sdk/tests",
    "server/tests",
    "examples/langgraph_sre_agent/tests",
    "examples/openai_agents_sre_agent/tests",
 ]
addopts = "-q"
