[project]
name = "afr-example-sre-agent"
version = "0.1.0"
description = "Example LangGraph SRE agent instrumented with Agent Flight Recorder"
requires-python = ">=3.11"
dependencies = [
    "agent-flight-recorder[langgraph]",
    "langchain==1.4.0",
    "langchain-core==1.6.3",
    "langgraph==1.2.11",
    "langgraph-prebuilt==1.1.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-openai==1.6.2",
]

[project.scripts]
afr-demo = "sre_agent.run:main"

[project.entry-points."afr.agents"]
checkout-api-sre = "sre_agent.agent:agent_spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sre_agent"]

[tool.uv.sources]
agent-flight-recorder = { workspace = true }
