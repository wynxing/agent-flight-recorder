[project]
name = "afr-example-openai-agents-sre-agent"
version = "0.1.0"
description = "Example OpenAI Agents SDK SRE agent instrumented with Agent Flight Recorder"
requires-python = ">=3.11"
dependencies = [
    "agent-flight-recorder[openai-agents]",
    "openai-agents==0.22.2",
]

[project.scripts]
afr-oa-demo = "oa_sre_agent.run:main"

[project.entry-points."afr.agents"]
checkout-api-sre-agents-sdk = "oa_sre_agent.agent:agent_spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oa_sre_agent"]

[tool.uv.sources]
agent-flight-recorder = { workspace = true }
