[project]
name = "agent-flight-recorder"
version = "0.1.0"
description = "Agent Flight Recorder SDK — record, replay and debug AI agents like software"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
# 完整的 LangGraph / LangChain 接入。版本刻意锁死：中间件钩子与 ToolCallRequest
# 的运行时形状由这批包决定，漂移会让录制静默失效。
langgraph = [
    "langchain==1.4.0",
    "langchain-core==1.6.3",
    "langgraph==1.2.11",
    # langchain.agents.middleware 只是转发 ToolCallRequest，真正的实现方是 langgraph-prebuilt。
    # 显式声明并锁版本，避免上游把它移走时只在运行时才炸。
    "langgraph-prebuilt==1.1.0",
    "langgraph-checkpoint-sqlite==3.1.1",
]
# OpenAI Agents SDK 适配层。同样锁版本：它没有 LangChain 那样的中间件协议，适配靠
# 实现它的 Model 协议与包装 FunctionTool，这两处的运行时形状是版本相关的。
openai-agents = [
    "openai-agents==0.22.2",
]
otel = [
    "opentelemetry-api>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_flight_recorder"]

