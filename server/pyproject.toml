[project]
name = "afr-server"
version = "0.1.0"
description = "Agent Flight Recorder server — ingest, store, replay and diff agent runs"
requires-python = ">=3.11"
dependencies = [
    "agent-flight-recorder",
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.35",
    "sqlmodel==0.0.42",
    "pydantic>=2.9",
]

[project.scripts]
afr-server = "afr_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afr_server"]

[tool.uv.sources]
agent-flight-recorder = { workspace = true }

