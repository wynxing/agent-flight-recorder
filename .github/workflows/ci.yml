name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python and console checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --all-packages

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install console dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install pi runner dependencies
        working-directory: integrations/pi
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck pi runner
        working-directory: integrations/pi
        run: npm run typecheck

      - name: Test pi runner
        working-directory: integrations/pi
        run: npm test

      - name: Run Python and cross-language tests
        run: uv run pytest

      - name: Typecheck console
        working-directory: web
        run: pnpm run typecheck

      - name: Build console
        working-directory: web
        run: pnpm run build
