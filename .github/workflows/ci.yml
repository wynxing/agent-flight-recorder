name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python, console and pi checks (strict)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 工具链由上面的 action 装上并走缓存；具体检查交给 scripts/test.ps1，
      # 让 CI 与本地走同一条代码路径，并用严格模式把任何跳过都判为失败：
      # 「CI 绿」因此等价于「Python、控制台与 pi 运行器都真的跑过」。
      - name: Run full verification (strict)
        run: pwsh scripts/test.ps1 -Strict
